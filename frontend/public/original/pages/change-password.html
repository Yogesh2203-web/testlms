<!doctype html>
<html lang="en"><head><script src="/lms-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password | Institute LMS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#18365e,#081326 48%,#050b16);font-family:Inter,Arial,sans-serif;color:#f7fbff;padding:20px}.card{width:min(460px,100%);padding:34px;border:1px solid #294767;background:rgba(12,27,48,.94);border-radius:22px;box-shadow:0 24px 80px #0008}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#2563eb,#22d3ee);font-size:22px;font-weight:800}.eyebrow{color:#67dff2;font-size:10px;letter-spacing:1.8px;font-weight:800;margin-top:24px}.card h1{font-size:27px;margin:9px 0}.desc{color:#a9bad0;font-size:13px;line-height:1.7}.field{display:grid;gap:7px;margin-top:18px}.field label{font-size:12px;font-weight:700}.field input{width:100%;padding:13px;border:1px solid #38516e;border-radius:10px;background:#071426;color:white;font:inherit}.btn{margin-top:22px;width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(90deg,#2563eb,#0891b2);color:white;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:15px;padding:12px;border-radius:9px;font-size:12px;line-height:1.5}.msg.show{display:block}.msg.error{background:#4a1d2b;color:#ffd9df}.msg.success{background:#123d37;color:#d4fff2}.hint{font-size:11px;color:#9eb0c6;margin-top:12px;line-height:1.6}
</style></head><body><main class="card"><div class="mark">I</div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Set your password</h1><p class="desc">Your account has a temporary password. Create a new private password before accessing your dashboard.</p><form id="changeForm"><div class="field"><label for="currentPassword">Temporary / current password</label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="12" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required></div><button class="btn" id="submitButton">Update password</button><div id="message" class="msg"></div><p class="hint">Use at least 12 characters. Do not reuse a password from another website.</p></form></main><script src="../assets/js/change-password.js"></script></body></html>
